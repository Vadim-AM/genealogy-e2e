[pytest]
testpaths = tests
pythonpath = .
addopts = --alluredir=allure-results
log_cli = true
log_cli_level = INFO
filterwarnings =
    ignore::DeprecationWarning
markers =
    smoke: minimal browser e2e smoke (run on every PR)
    regression: regression tests for closed BUG-* tickets
    slow: tests that take > 5s (skip with -m "not slow")
    auth: signup, login, logout, verify, forgot/reset, invite-accept, session flows
    tree: tree rendering, navigation, profile, person editor, photos, invariants
    platform: superadmin platform features (dashboard, MFA, WebAuthn, ops endpoints)
    admin: tenant-level admin (owner UI, admin UI, site config, subscription)
    security: CSP, headers, timing attacks, role permissions, compliance, PII
    enrichment: AI enrichment (★ Найти больше) flow, consent, disabled-mode
    ui: landing, i18n, a11y, responsive, mobile, legal, pricing, waitlist
    serial: mutates shared stand/backend state (superadmin/platform settings,
        global AI flag, timing-sensitive) — run single-worker with per-test
        reset; auto-applied in conftest. Parallel pass excludes via -m "not serial".
