# docker-compose.yml — e2e test environment
#
# Three services:
#   db       — PostgreSQL 16 with raised lock limits for parallel test runs
#   backend  — test-instrumented genealogy backend (GHCR image or local build)
#   e2e      — this repo: pytest + Playwright Chromium
#
# Local usage:
#   docker compose up --build --abort-on-container-exit e2e
#
# Override backend image:
#   BACKEND_IMAGE=ghcr.io/vadim-am/genealogy-backend:pr-42 docker compose up --build e2e
#
# Run a subset:
#   docker compose run --rm e2e pytest tests/auth/ -v
#
# Allure report:
#   allure serve test-results/allure-results

services:
  db:
    image: postgres:16-alpine
    command: ["-c", "max_locks_per_transaction=4096", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: genealogy
      POSTGRES_PASSWORD: genealogy
      POSTGRES_DB: genealogy_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genealogy -d genealogy_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/vadim-am/genealogy-backend:test-latest}
    environment:
      GENEALOGY_TESTING: "1"
      GENEALOGY_ADMIN_PASSWORD: test_admin_password
      GENEALOGY_TEST_TOKEN: e2e-test-token-default-2026
      GENEALOGY_PUBLIC_URL: http://backend:8642
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGIN: http://backend:8642
      EMAIL_PROVIDER: mock
      FREE_SIGNUP_LIMIT: "1000"
      PLATFORM_SUPERADMIN_EMAILS: super@e2e.example.com
      ANTHROPIC_API_KEY: sk-test-stub
      GENEALOGY_TENANTS_ROOT: /tmp/genealogy-e2e-tenants
      GENEALOGY_TRUST_FORWARDED_FOR: "1"
      GENEALOGY_DOCS_ENABLED: "1"
      DATABASE_URL: postgresql+psycopg://genealogy:genealogy@db:5432/genealogy_test
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8642/api/health').read()"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  e2e:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      E2E_BACKEND_URL: http://backend:8642
      E2E_TIMEOUT_MULTIPLIER: "1.5"
    volumes:
      - ./test-results:/e2e/test-results
